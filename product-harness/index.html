<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロダクトハーネス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700;800;900&family=Google+Sans+Code:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f0f0f0; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  body.pointer canvas { cursor: default; }
  #notes {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(1100px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 18px 22px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.96); border: 2px solid #1e1e1e;
    color: #1e1e1e; font: 16px/1.7 "Noto Sans JP", "Hiragino Sans", sans-serif;
    display: none;
  }
  #notes.on { display: block; }
  #notes .meta { font: 12px "Google Sans Code", Menlo, monospace; color: #6b6b6b; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 16px; }
  #help {
    position: fixed; right: 16px; top: 16px; padding: 12px 16px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.96); border: 2px solid #1e1e1e; color: #4a4a4a;
    font: 12px/1.9 "Google Sans Code", Menlo, monospace; display: none;
  }
  #help.on { display: block; }
  #help b { color: #1e1e1e; font-weight: 700; }
</style>
<script>
  // engine-core.js より前に読み込む。GDG のパレット（Off White 地・Black 02 の文字）に合わせる
  window.ENGINE_THEME = {
    col: {
      bg: '#f0f0f0', ink: '#1e1e1e', ink2: '#4a4a4a', ink3: '#8a8a8a', line: '#d3d3d3',
      panel: '#ffffff', panel2: '#f7f7f7', code: '#fafafa', warmBg: '#f8d8d8',
      warm: '#ea4335', cool: '#4285f4', green: '#34a853', red: '#ea4335',
      yellow: '#f9ab00', gray: '#8a8a8a', violet: '#4285f4',
      // 小さい文字に使う濃いめの色（白地でのコントラスト確保）
      blueInk: '#1967d2', greenInk: '#188038', redInk: '#c5221f', yellowInk: '#a86a00',
      pBlue: '#c3ecf6', pGreen: '#ccf6c5', pYellow: '#ffe7a5', pRed: '#f8d8d8', onDark: '#bdbdbd',
    },
    fs: '"Google Sans Flex","Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif',
    fm: '"Google Sans Code","JetBrains Mono",Menlo,Consolas,"Noto Sans JP",monospace',
    fonts: [['Google Sans Flex', [400, 500, 700, 800, 900]], ['Google Sans Code', [400, 700]]],
    chapters: ['イントロ', '背景', '主張と全体像', '軸① 認証認可基盤', '軸② デザインシステム', '軸③ ハーネス', '土台と伏線回収', '実践の急所', 'まとめ', 'お知らせ'],
  };
</script>
</head>
<body>
<canvas id="stage" aria-label="内製化で全てを解決するためのプロダクトハーネス（モーショングラフィックス・プレゼンテーション）"></canvas>
<div id="notes"><div class="meta"><span id="notes-title"></span><span id="notes-next"></span></div><div id="notes-body"></div></div>
<div id="help">
  <b>→ / Space / クリック</b> 次へ<br>
  <b>← / Shift+クリック</b> 戻る<br>
  <b>N</b> スピーカーノート<br>
  <b>P</b> 発表者ウィンドウ<br>
  <b>F</b> フルスクリーン<br>
  <b>Home / End</b> 最初 / 最後<br>
  <b>?</b> このヘルプ
</div>
<script src="../engine/engine-core.js"></script>
<script src="scenes-intro.js"></script>
<script src="scenes-map.js"></script>
<script src="scenes-axes.js"></script>
<script src="scenes-outro.js"></script>
<script src="../engine/engine-run.js"></script>
</body>
</html>
