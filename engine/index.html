<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デザインハーネス for Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f5f6f8; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  body.pointer canvas { cursor: default; }
  #notes {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(1100px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 18px 22px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.95); border: 1px solid #d6dce5;
    box-shadow: 0 10px 32px rgba(20, 26, 36, 0.12);
    color: #141a24; font: 16px/1.7 "Noto Sans JP", "Hiragino Sans", sans-serif;
    display: none; backdrop-filter: blur(8px);
  }
  #notes.on { display: block; }
  #notes .meta { font: 12px "JetBrains Mono", Menlo, monospace; color: #8a93a3; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 16px; }
  #help {
    position: fixed; right: 16px; top: 16px; padding: 12px 16px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.95); border: 1px solid #d6dce5; color: #4a5466;
    box-shadow: 0 10px 32px rgba(20, 26, 36, 0.12);
    font: 12px/1.9 "JetBrains Mono", Menlo, monospace; display: none;
  }
  #help.on { display: block; }
  #help b { color: #141a24; font-weight: 700; }
</style>
</head>
<body>
<canvas id="stage" aria-label="デザインハーネスをエンジニア向けに説明する（モーショングラフィックス・プレゼンテーション）"></canvas>
<div id="notes"><div class="meta"><span id="notes-title"></span><span id="notes-next"></span></div><div id="notes-body"></div></div>
<div id="help">
  <b>→ / Space / クリック</b> 次へ<br>
  <b>← / Shift+クリック</b> 戻る<br>
  <b>N</b> スピーカーノート<br>
  <b>P</b> 発表者ウィンドウ<br>
  <b>F</b> フルスクリーン<br>
  <b>Home / End</b> 最初 / 最後<br>
  <b>?</b> このヘルプ
</div>
<script src="engine-core.js"></script>
<script src="scenes-1.js"></script>
<script src="scenes-2.js"></script>
<script src="scenes-arch.js"></script>
<script src="scenes-3.js"></script>
<script src="engine-run.js"></script>
</body>
</html>
