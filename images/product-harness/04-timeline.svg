    <line x1="200" y1="548" x2="200" y2="572"/><line x1="392" y1="548" x2="392" y2="572"/><line x1="585" y1="548" x2="585" y2="572"/><line x1="777" y1="548" x2="777" y2="572"/><line x1="970" y1="548" x2="970" y2="572"/><line x1="1162" y1="548" x2="1162" y2="572"/><line x1="1355" y1="548" x2="1355" y2="572"/><line x1="1547" y1="548" x2="1547" y2="572"/><line x1="1740" y1="548" x2="1740" y2="572"/>
  </g>
