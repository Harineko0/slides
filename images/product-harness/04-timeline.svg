    <circle cx="770" cy="560" r="18" fill="#34A853" stroke="#1E1E1E" stroke-width="4"/>
    <text x="740" y="690">tinyurl</text>
    <circle cx="808" cy="560" r="12" fill="#34A853" stroke="#1E1E1E" stroke-width="4"/>
    <text x="830" y="740">img</text>
    <circle cx="858" cy="560" r="12" fill="#34A853" stroke="#1E1E1E" stroke-width="4"/>
    <text x="900" y="690">scheduler</text>
    <circle cx="1340" cy="560" r="12" fill="#34A853" stroke="#1E1E1E" stroke-width="4"/>
    <text x="1310" y="690">sns</text>
    <circle cx="1425" cy="560" r="12" fill="#34A853" stroke="#1E1E1E" stroke-width="4"/>
