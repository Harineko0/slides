  <g font-size="30" font-weight="700" text-anchor="middle">
    <rect x="640" y="300" width="260" height="120" rx="28" fill="#4285F4" stroke="#1E1E1E" stroke-width="4"/>
    <text x="770" y="352" fill="#FFFFFF">認証認可基盤</text>
    <text x="770" y="392" fill="#FFFFFF" font-size="24" font-weight="400">accounts</text>
